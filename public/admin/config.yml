backend:
  name: github
  repo: l1secc/l1secc.github.io
  branch: main
  client_id: 0v23LiAwbRdyHxQ3FqR2
  site_url: https://keremdemir.me
  use_proxy: false

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["Cybersecurity", "Web Security", "Linux", "CTF Writeups", "Research", "Other"]}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
